<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Training Assessment AI{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar"><a class="brand" href="/">Assessment Studio</a>{% if request.session.get('trainer_authenticated') %}<form method="post" action="/logout"><input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}"><button class="button button-quiet" type="submit">Sign out</button></form>{% endif %}</header>
<main class="container">{% block content %}{% endblock %}</main>
<footer class="footer">Training Assessment AI · Trainer-reviewed questions · Secure submissions</footer>
</body></html>
