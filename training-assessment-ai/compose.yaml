services:
  assessment-app:
    build: .
    container_name: training-assessment-ai
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
    ports:
      # Bind to localhost for SSH-tunnel/reverse-proxy deployments. For temporary direct testing only,
      # change the left side to 8000 (8000:8000) and restrict inbound access in the EC2 security group.
      - "127.0.0.1:8000:8000"
    volumes:
      - assessment_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
volumes:
  assessment_data:
