services:
  assessment-ollama-test:
    build: .
    container_name: assessment-ollama-test
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:0.5b-instruct}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
    ports:
      # Isolated test app on host port 8001 (keeping production app running on port 8000)
      - "0.0.0.0:8001:8000"
    volumes:
      # Isolated persistent volume for test app (does not overwrite production assessment_data)
      - assessment_test_data:/app/data
    networks:
      - ollama_private_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Optional local Ollama service for environments without an existing Ollama container.
  # On EC2, this service is skipped because the existing 'ollama' container is reused.
  # Run 'docker compose --profile local-ollama up -d' only if testing locally without an external Ollama daemon.
  ollama:
    image: ollama/ollama:latest
    container_name: assessment-ollama-local
    restart: unless-stopped
    profiles:
      - local-ollama
    volumes:
      - ollama_test_data:/root/.ollama
    networks:
      - ollama_private_network
    # Port 11434 is NOT exposed to host or internet; accessible only internally within ollama_private_network.
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  ollama_private_network:
    name: ollama_private_network
    external: true

volumes:
  assessment_test_data:
  ollama_test_data:
